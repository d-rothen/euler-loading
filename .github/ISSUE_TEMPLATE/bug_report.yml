name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead. Include the full traceback if there is one.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        The smallest `Modality` / `MultiModalDataset` construction that shows the
        problem. Paths can be redacted.
      render: python
    validations:
      required: true

  - type: textarea
    id: layout
    attributes:
      label: Dataset layout
      description: >
        Relevant parts of the modality tree and the `.ds_crawler` artifacts —
        directory vs zip, whether `metadata_scope` or `split` is in use.
      render: text

  - type: input
    id: versions
    attributes:
      label: Versions
      description: >
        euler-loading, ds-crawler, Python and torch versions. Quick way to get them:
        `python -c "import importlib.metadata as m; print(*(f'{p}=={m.version(p)}' for p in ('euler-loading','ds-crawler','torch','numpy')))"`
      placeholder: euler-loading==2.21.0 ds-crawler==2.10.0 torch==2.13.0 numpy==2.4.6, Python 3.11
    validations:
      required: true
