name: Feature request
description: Propose a capability or a loader for a new dataset
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The use case, rather than the proposed API. What is awkward or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Optional. A sketch of the API or loader you have in mind.
      render: python

  - type: input
    id: dataset
    attributes:
      label: Dataset
      description: For a new loader — which dataset, and is it publicly available?
