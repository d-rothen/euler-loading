name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # Install the CPU-only torch build first; the default index would pull
      # the multi-gigabyte CUDA wheels, which CI has no use for.
      - name: Install CPU-only PyTorch
        run: uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: uv pip install --system -e ".[dev]"

      - name: Run tests
        run: pytest -q

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build package
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*
