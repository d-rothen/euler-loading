name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # A venv, not `uv pip install --system`: the interpreter uv manages is
      # marked externally managed and refuses to be installed into.
      - name: Create the test environment
        run: uv venv --python ${{ matrix.python-version }}

      # CPU-only torch, installed first so it is the build that satisfies the
      # package's torch requirement. The default index would pull the
      # multi-gigabyte CUDA wheels, which CI has no use for.
      - name: Install CPU-only PyTorch
        run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: uv pip install -e ".[gpu,dev]"

      - name: Run tests
        run: uv run --no-sync pytest -q

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build package
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*
