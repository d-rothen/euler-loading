[project]
name = "euler-loading"
version = "2.50.0"
description = "Multi-modal PyTorch dataloader using ds-crawler indices"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Rothenpieler", email = "rothenpielerdaniel@gmail.com" }]
keywords = [
    "pytorch",
    "dataloader",
    "dataset",
    "multi-modal",
    "computer-vision",
    "depth-estimation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
dependencies = [
    "numpy",
    "Pillow",
    "ds-crawler>=2.14.0",
    "euler-dataset-contract>=0.23.0",
]

[project.optional-dependencies]
gpu = ["torch"]
synscapes = ["OpenEXR>=3.2"]
hypersim = ["h5py"]
urbansyn = ["OpenEXR>=3.2"]
dev = ["pytest", "OpenEXR>=3.2", "jsonschema>=4.18", "h5py"]

[project.scripts]
euler-loading = "euler_loading.cli:main"

# euler-loading registers its own loaders exactly as a third-party package
# would (see "Extending: your own loaders" in the README). Adding a loader
# means adding it here and in euler_loading/loaders/builtin.py, then
# reinstalling so the entry point exists.
[project.entry-points."euler.loaders"]
acdc = "euler_loading.loaders.builtin:acdc"
cerema = "euler_loading.loaders.builtin:cerema"
driving_stereo = "euler_loading.loaders.builtin:driving_stereo"
generic = "euler_loading.loaders.builtin:generic"
generic_dense_depth = "euler_loading.loaders.builtin:generic_dense_depth"
hypersim = "euler_loading.loaders.builtin:hypersim"
kitti_carla = "euler_loading.loaders.builtin:kitti_carla"
materialized = "euler_loading.loaders.builtin:materialized"
muses = "euler_loading.loaders.builtin:muses"
nuscenes = "euler_loading.loaders.builtin:nuscenes"
princeton_dense = "euler_loading.loaders.builtin:princeton_dense"
real_drive_sim = "euler_loading.loaders.builtin:real_drive_sim"
scatternerf = "euler_loading.loaders.builtin:scatternerf"
shift = "euler_loading.loaders.builtin:shift"
synscapes = "euler_loading.loaders.builtin:synscapes"
urbansyn = "euler_loading.loaders.builtin:urbansyn"
vkitti2 = "euler_loading.loaders.builtin:vkitti2"

[project.entry-points."euler.capabilities"]
euler-loading = "euler_loading.capability_report:loader_report"

[project.urls]
Homepage = "https://github.com/d-rothen/euler-loading"
Repository = "https://github.com/d-rothen/euler-loading"
Issues = "https://github.com/d-rothen/euler-loading/issues"
Documentation = "https://github.com/d-rothen/euler-loading/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-m 'not real'"
markers = ["real: tests that require real on-disk datasets (deselected by default)"]

[tool.hatch.build.targets.wheel]
packages = ["euler_loading"]

[tool.hatch.build.targets.sdist]
include = ["euler_loading", "tests", "docs", "examples", "README.md", "CHANGELOG.md", "LICENSE"]
