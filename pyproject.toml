[project]
name = "euler-loading"
version = "2.22.0"
description = "Multi-modal PyTorch dataloader using ds-crawler indices"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Rothenpieler", email = "rothenpielerdaniel@gmail.com" }]
keywords = [
    "pytorch",
    "dataloader",
    "dataset",
    "multi-modal",
    "computer-vision",
    "depth-estimation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
dependencies = [
    "numpy",
    "Pillow",
    "ds-crawler>=2.3.0",
    "euler-dataset-contract>=0.2.1",
]

[project.optional-dependencies]
gpu = ["torch"]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/d-rothen/euler-loading"
Repository = "https://github.com/d-rothen/euler-loading"
Issues = "https://github.com/d-rothen/euler-loading/issues"
Documentation = "https://github.com/d-rothen/euler-loading/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-m 'not real'"
markers = ["real: tests that require real on-disk datasets (deselected by default)"]

[tool.hatch.build.targets.wheel]
packages = ["euler_loading"]

[tool.hatch.build.targets.sdist]
include = ["euler_loading", "tests", "docs", "examples", "README.md", "LICENSE"]
